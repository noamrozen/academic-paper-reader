[project]
name = "academic-paper-reader"
version = "0.1.0"
description = "Read arXiv papers with an agentic LLM assistant (Claude, OpenAI, Gemini)"
authors = [
    { name = "Noam Rozen", email = "noamr@ai21.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    # faster-whisper 1.2 decodes audio with an av.open() argument that av 18 removed
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.0",
    "fastapi>=0.142.2",
    "faster-whisper>=1.2.1",
    "google-genai>=2.28.0",
    "httpx>=0.28.1",
    "openai>=3.24.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

